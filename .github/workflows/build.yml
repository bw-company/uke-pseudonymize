on:
  push:
    branches: master
  pull_request: {}

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install inspequte
        uses: KengoTODA/setup-inspequte@c18ec2ad0423af57c89d5de7bc3d4e4bf28747f5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon
      - name: Upload inspequte SARIF
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('app/build/inspequte/main/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/inspequte/main/report.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Gradle reports
          path: app/build/reports
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: Executables
          path: app/build/distributions
